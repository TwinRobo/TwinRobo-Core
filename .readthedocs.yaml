# Read the Docs: https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true # a broken link or a docstring parameter not in the signature fails it

python:
  install:
    - requirements: docs/requirements.txt
