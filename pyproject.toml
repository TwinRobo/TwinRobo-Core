[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twinrobo-core"
dynamic = ["version"]
description = "TwinRobo: physically grounded digital twins of real cameras for robot learning in simulation."
readme = "README.md"
authors = [{name = "TwinRobo contributors"}]
license = "AGPL-3.0-only AND Apache-2.0"  # the code; the camera catalog (twinrobo/catalog/) is Apache-2.0
license-files = ["LICENSE", "LICENSE-EXCEPTION.md", "COMMERCIAL.md", "NOTICE", "twinrobo/catalog/LICENSE"]
# DeepLens (deeplens-core) requires Python 3.12; TwinRobo inherits it.
requires-python = ">=3.12,<3.13"
dependencies = [
    # DeepLens (PyPI); 2.5.6 is the first to accept torch>=2.10 (Isaac Sim 6.1 ships 2.11)
    "deeplens-core>=2.5.6",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://twinrobo.github.io/"
Documentation = "https://twinrobo.github.io/"
Repository = "https://github.com/TwinRobo/TwinRobo-Core"
Changelog = "https://github.com/TwinRobo/TwinRobo-Core/blob/main/CHANGELOG.md"
Issues = "https://github.com/TwinRobo/TwinRobo-Core/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# MuJoCo adapter
mujoco = [
    "mujoco==3.3.2",
    "warp-lang>=1.17",  # GPU ray casting for render="raycast"
]
# Isaac Sim adapter: Isaac Sim 6.1 from PyPI (it brings torch 2.11 and its own MuJoCo, so it
# does not combine with the mujoco extra); or use the container, docker/isaac/run.sh
isaac = [
    "isaacsim[all,extscache]==6.1.0.0",
]
# LIBERO plugin (LIBERO itself: set LIBERO_ROOT to a checkout, see twinrobo/datasets/libero)
libero = [
    "mujoco==3.3.2",
    "robosuite==1.4.1",
    "bddl==1.0.1",
    "gym==0.25.2",
    "easydict",
    "future",
    "h5py",
    "warp-lang>=1.17",
]

[tool.setuptools.dynamic]
version = {attr = "twinrobo.version.__version__"}

[tool.setuptools.packages.find]
include = ["twinrobo*"]

[tool.setuptools.package-data]
# the built-in camera catalog: specs, lens files, stereo modules
twinrobo = ["catalog/**/*.yaml", "catalog/**/*.json", "catalog/**/*.md", "catalog/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib: test folders named like packages (tests/plugins/mujoco, tests/datasets/libero, ...) are never
# put on sys.path, where they would pose as those packages when they are not installed
addopts = "--import-mode=importlib"
markers = [
    "deeplens: requires the DeepLens optics engine",
    "gpu: requires a CUDA device",
    "isaac: requires NVIDIA Isaac Sim",
    "gl: requires an offscreen OpenGL backend (EGL/OSMesa) for MuJoCo rendering",
    "libero: requires LIBERO (LIBERO_ROOT and LIBERO_CONFIG_PATH)",
    "robocasa: requires RoboCasa (robosuite 1.5; the twinrobo-robocasa env)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
