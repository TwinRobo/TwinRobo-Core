# Stereo camera module (schema 0.1): two eyes in one housing. Poses of the module are
# those of the LEFT eye (Stereolabs convention); the right eye sits at `translation_m` in
# the left eye's camera frame (+x = image right). A per-serial factory calibration
# replaces the baseline and adds a small rotation without schema changes.
schema_version: 0.1
id: stereolabs/zed-x-mini/2.2mm
type: stereo
manufacturer: Stereolabs
product: ZED X Mini (2.2 mm)
reference: left
eyes:
  left: {spec: ../../zed-x/2.2mm/camera.yaml}  # same 2.2 mm eye as the ZED X
  right: {spec: ../../zed-x/2.2mm/camera.yaml, translation_m: [0.05, 0.0, 0.0], rotation_rpy_deg: [0.0, 0.0, 0.0]}
housing_mm: [94, 30, 37]   # width, height, depth (for drawing)
output: rectified         # what the SDK delivers by default: rectified | raw
