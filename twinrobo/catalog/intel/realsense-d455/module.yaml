# Stereo camera module (schema 0.1): two eyes in one housing. Poses of the module are
# those of the LEFT eye; the right eye sits at `translation_m` in the left eye's camera
# frame (+x = image right). A per-unit calibration (twinrobo.calibration) replaces the
# baseline and adds a small rotation without schema changes.
# Provenance: Intel RealSense D400 series datasheet, Oct 2025 (baseline 95 mm, Tables 3-11, 3-49; https://realsenseai.com/wp-content/uploads/2025/09/Intel-RealSense-D400-Series-Datasheet-October-2025.pdf).
# Housing: approximate outer size, for drawing only.
schema_version: 0.1
id: intel/realsense-d455
type: stereo
manufacturer: Intel
product: RealSense D455
reference: left
eyes:
  left: {spec: depth/camera.yaml}
  right: {spec: depth/camera.yaml, translation_m: [0.095, 0.0, 0.0], rotation_rpy_deg: [0.0, 0.0, 0.0]}
housing_mm: [124, 26, 29]   # width, height, depth (for drawing)
output: rectified         # what the SDK delivers by default: rectified | raw
