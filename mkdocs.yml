site_name: TwinRobo
site_description: Physically grounded digital twins of real cameras for robot learning in simulation
repo_url: https://github.com/TwinRobo/TwinRobo-Core
repo_name: TwinRobo/TwinRobo-Core
edit_uri: edit/main/docs/
copyright: TwinRobo contributors · AGPL-3.0 or commercial license · camera catalog Apache-2.0

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/TwinRobo/TwinRobo-Core
      name: TwinRobo on GitHub
  generator: false

nav:
  - Home: index.md
  - Get started: getting-started.md
  - Guide:
      - Optics and rendering: rendering.md
      - Cameras and stereo: cameras.md
      - Simulators: simulators.md
      - Calibrate a real camera: calibration.md
  - Camera catalog: catalog.md
  - API reference:
      - api/index.md
      - Core: api/core.md
      - Optics: api/optics.md
      - Sensor and ISP: api/sensor_isp.md
      - MuJoCo: api/mujoco.md
      - Isaac Sim: api/isaac.md
      - LIBERO and RoboCasa: api/robot_learning.md
      - Calibration: api/calibration.md
      - Validation: api/validation.md
  - Community:
      - Contributing: contributing.md
      - Camera partners: partners.md
  - Development:
      - Layout and tests: development.md
      - Optics benchmark: benchmarks/phase1_optics.md

plugins:
  - search
  - gen-files:
      scripts:
        - tools/docs/gen_pages.py   # home (README), contributing, camera catalog
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            members_order: source
            merge_init_into_class: true
            filters: ["!^_"]
            heading_level: 2
            show_symbol_type_heading: true
            show_symbol_type_toc: true

hooks:
  - tools/docs/hooks.py   # repo-relative links (GitHub) -> site links

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.superfences
  - pymdownx.inlinehilite

validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: warn
  anchors: warn
