site_name: TwinRobo API
site_description: Physically grounded digital twins of real cameras for robot learning in simulation
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://twinrobo-core.readthedocs.io/en/latest/"]
repo_url: https://github.com/TwinRobo/TwinRobo-Core
repo_name: TwinRobo/TwinRobo-Core
edit_uri: edit/main/docs/
copyright: >-
  TwinRobo contributors · AGPL-3.0 or commercial license · camera catalog Apache-2.0

theme:
  name: material
  custom_dir: tools/docs/overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/TwinRobo/TwinRobo-Core
      name: TwinRobo on GitHub
  generator: false

exclude_docs: requirements.txt

nav:
  - Overview: index.md
  - Specs and catalog: cameras/specs.md
  - Cameras:
      - Devices: cameras/devices.md
      - Camera: cameras/camera.md
      - Stereo: cameras/stereo.md
      - LiDAR: cameras/lidar.md
      - Frames: cameras/frames.md
  - Imaging:
      - Optics: imaging/optics.md
      - Sensor and ISP: imaging/sensor-isp.md
  - Simulators:
      - MuJoCo: simulators/mujoco.md
      - Isaac Sim: simulators/isaac.md
  - Datasets:
      - LIBERO: datasets/libero.md
      - RoboCasa: datasets/robocasa.md
  - Tools:
      - Calibration: tools/calibration.md
      - Validation: tools/validation.md
  - Errors: cameras/errors.md

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            line_length: 72      # one argument per line when it does not fit
            signature_crossrefs: true
            members_order: source
            merge_init_into_class: true
            filters: ["!^_"]
            heading_level: 3
            show_labels: false
            summary:
              functions: true
              classes: true

hooks:
  - tools/docs/catalog_ids.py   # the catalog's IDs on the specs page

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - toc: {permalink: true, toc_depth: "2-3"}   # right sidebar: groups and their entries
  - pymdownx.details
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.superfences
  - pymdownx.inlinehilite

validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: warn
  anchors: warn
